name: Project checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Verify original model integrity
        run: python -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('model3.h5').read_bytes()).hexdigest() == '73d8c9649771a76c1c9f3b83dba24cba140b7ea1a349055f43f9374eea4e04c1'"
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build deployment package
        run: docker build --platform linux/amd64 --build-arg VCS_REF="$GITHUB_SHA" -t northstar-test .
      - name: Verify packaged tests and inference
        run: docker run --rm northstar-test python -m unittest discover -s tests -v
      - name: Verify packaged HTTP service
        run: |
          docker run --detach --name northstar-smoke -p 127.0.0.1:8501:8501 northstar-test
          python scripts/smoke_container.py
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force northstar-smoke || true
